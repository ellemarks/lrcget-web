# Example deployment of the LRCGET web server.
#
#   cp .env.example .env    # then set your music folder and a password
#   docker compose up -d
#
# This pulls the published image (amd64 and arm64). To build from this checkout instead, run
# `docker compose up -d --build`.
#
# and open http://<host>:3000
services:
  lrcget:
    image: ghcr.io/ellemarks/lrcget-web:latest
    build: .
    container_name: lrcget
    restart: unless-stopped
    # Run as the user that owns your music, so LRCGET can write .lrc files next to it
    user: "${LRCGET_UID:-1000}:${LRCGET_GID:-1000}"
    ports:
      - "${LRCGET_PORT:-3000}:3000"
    environment:
      # To disable the login (e.g. behind an authenticating reverse proxy), delete these two lines
      LRCGET_USERNAME: ${LRCGET_USERNAME:-lrcget}
      LRCGET_PASSWORD: ${LRCGET_PASSWORD:?Set LRCGET_PASSWORD in .env (see .env.example)}
    volumes:
      # Database and transcoding cache. A named volume gets the right owner automatically.
      # To keep it in a host folder instead (e.g. ./data:/data), create that folder first and
      # make sure it is owned by LRCGET_UID, otherwise Docker creates it as root.
      - lrcget-data:/data
      # Everything under /music can be browsed, scanned and played
      - type: bind
        source: ${LRCGET_MUSIC_DIR:?Set LRCGET_MUSIC_DIR in .env (see .env.example)}
        target: /music
        bind:
          create_host_path: false

volumes:
  lrcget-data:
